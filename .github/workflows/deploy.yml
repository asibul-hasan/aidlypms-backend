name: Test and Deploy .NET API to Hugging Face

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aidly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify schema.sql and db_script.sql into fresh PostgreSQL databases
        env:
          PGPASSWORD: testpassword
        run: |
          echo "Testing fresh schema.sql load into empty database..."
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS test_schema;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE test_schema;"
          psql -h localhost -U postgres -d test_schema -v ON_ERROR_STOP=1 -f database/schema.sql

          echo "Testing fresh db_script.sql load into empty database..."
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS test_db_script;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE test_db_script;"
          psql -h localhost -U postgres -d test_db_script -v ON_ERROR_STOP=1 -f database/db_script.sql

          SCHEMA_COUNT=$(psql -h localhost -U postgres -d test_schema -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          SCRIPT_COUNT=$(psql -h localhost -U postgres -d test_db_script -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "schema.sql tables: $SCHEMA_COUNT"
          echo "db_script.sql tables: $SCRIPT_COUNT"
          if [ "${SCHEMA_COUNT// /}" -ne 57 ] || [ "${SCRIPT_COUNT// /}" -ne 57 ]; then
            echo "::error::Schema verification failed: Expected 57 tables in both databases!"
            exit 1
          fi
          echo "Both schema.sql and db_script.sql loaded into empty databases without errors (57 tables each)."

          echo "Pre-populating aidly_test database with schema.sql..."
          psql -h localhost -U postgres -d aidly_test -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Integration Tests on throwaway PostgreSQL 16
        env:
          TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=aidly_test;Username=postgres;Password=testpassword"
        run: |
          dotnet test tests/AidlyPms.Api.Tests/AidlyPms.Api.Tests.csproj --logger "console;verbosity=normal"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git config --global user.email "asibulhasan23@gmail.com"
          git config --global user.name "asibul"

          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing or empty in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Validating Hugging Face credentials with Hugging Face API..."
          AUTH_RESP=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2)
          HTTP_STATUS=$(echo "$AUTH_RESP" | tail -n 1)
          BODY=$(echo "$AUTH_RESP" | head -n -1)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Hugging Face token authentication failed with HTTP status $HTTP_STATUS."
            echo "Response: $BODY"
            echo "::error::Please verify that your HF_TOKEN secret in GitHub matches an active token from https://huggingface.co/settings/tokens."
            exit 1
          fi

          TOKEN_USER=$(echo "$BODY" | grep -o '"name":"[^"]*' | head -1 | cut -d'"' -f4)
          TOKEN_ROLE=$(echo "$BODY" | grep -o '"role":"[^"]*' | head -1 | cut -d'"' -f4)
          echo "Authenticated to Hugging Face as user: '$TOKEN_USER' (role: '${TOKEN_ROLE:-custom}')"

          if [ "$TOKEN_ROLE" = "read" ]; then
            echo "::error::Your HF_TOKEN has 'read' permission only. Hugging Face requires a 'write' role to push code."
            echo "::error::Please go to https://huggingface.co/settings/tokens, create a token with 'Write' role, and update HF_TOKEN in GitHub repository secrets."
            exit 1
          fi

          HF_SPACE_OWNER="asibul-07"
          HF_SPACE_NAME="Infoaidtech"
          echo "Targeting Space: https://huggingface.co/spaces/${HF_SPACE_OWNER}/${HF_SPACE_NAME}"

          git remote remove hf 2>/dev/null || true
          git remote add hf "https://${TOKEN_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_OWNER}/${HF_SPACE_NAME}"
          git push --force hf main
