name: Deploy .NET API to Hugging Face

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git config --global user.email "asibulhasan23@gmail.com"
          git config --global user.name "asibul"

          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing in GitHub repository settings."
            exit 1
          fi

          # Resolve Hugging Face username (the Infoaidtech space is hosted under asibul-07)
          TARGET_USER="${HF_USERNAME:-asibul-07}"
          if [ "$TARGET_USER" = "asibul" ] || [ -z "$TARGET_USER" ]; then
            TARGET_USER="asibul-07"
          fi

          echo "Deploying to Hugging Face Space: ${TARGET_USER}/Infoaidtech"
          HF_URL="https://${TARGET_USER}:${HF_TOKEN}@huggingface.co/spaces/${TARGET_USER}/Infoaidtech"

          git remote remove hf 2>/dev/null || true
          git remote add hf "$HF_URL"
          git push --force hf main
